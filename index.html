<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Daily - 智能日报系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: linear-gradient(135deg, #1a73e8, #4285f4);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        header h1 { font-size: 28px; margin-bottom: 8px; }
        header p { opacity: 0.9; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #333;
            border-bottom: 2px solid #1a73e8;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #555;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
        }
        select, button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
        }
        select { width: 100%; }
        button {
            background: #1a73e8;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { background: #1557b0; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .section {
            margin-bottom: 24px;
        }
        .section h3 {
            font-size: 16px;
            color: #1a73e8;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .news-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .news-item:last-child { border-bottom: none; }
        .news-item a {
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }
        .news-item a:hover { color: #1a73e8; }
        .news-item .source {
            color: #999;
            font-size: 12px;
            margin-left: 8px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error {
            color: #d32f2f;
            padding: 20px;
            text-align: center;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }
        .stat {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #1a73e8;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart Daily</h1>
            <p>智能日报系统 - 选择内容，生成专属报告</p>
        </header>

        <div class="card">
            <h2>生成报告</h2>
            <div class="form-group">
                <label>报告类型</label>
                <select id="reportType">
                    <option value="daily">日报（24小时）</option>
                    <option value="weekly">周报（7天）</option>
                    <option value="monthly">月报（30天）</option>
                    <option value="yearly">年报（365天）</option>
                </select>
            </div>
            <div class="form-group">
                <label>选择板块（可多选）</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" value="AI/科技" checked> AI/科技</label>
                    <label><input type="checkbox" value="政治"> 政治</label>
                    <label><input type="checkbox" value="财经"> 财经</label>
                    <label><input type="checkbox" value="民生"> 民生</label>
                    <label><input type="checkbox" value="科技"> 科技</label>
                    <label><input type="checkbox" value="其他"> 其他</label>
                </div>
            </div>
            <div class="form-group">
                <button id="generateBtn" onclick="generateReport()">生成报告</button>
            </div>
        </div>

        <div class="card">
            <h2>最新日报</h2>
            <div id="reportContent">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        // GitHub 仓库信息
        const REPO = 'HAaaNa1777/smart-daily-2';
        const DATA_URL = `https://raw.githubusercontent.com/${REPO}/main/data/report-daily.json`;

        // 加载最新报告
        async function loadReport() {
            const container = document.getElementById('reportContent');
            try {
                const response = await fetch(DATA_URL);
                if (!response.ok) throw new Error('报告不存在');
                const data = await response.json();
                renderReport(data);
            } catch (e) {
                container.innerHTML = `
                    <div class="error">
                        暂无报告数据。<br>
                        请先点击上方"生成报告"按钮触发生成。
                    </div>
                `;
            }
        }

        // 渲染报告
        function renderReport(data) {
            const container = document.getElementById('reportContent');
            const sections = data.sections || {};

            // 统计
            let totalItems = 0;
            Object.values(sections).forEach(items => totalItems += items.length);

            let html = `
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value">${totalItems}</div>
                        <div class="stat-label">总新闻数</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${Object.keys(sections).length}</div>
                        <div class="stat-label">板块数</div>
                    </div>
                </div>
            `;

            // 各板块
            for (const [section, items] of Object.entries(sections)) {
                if (!items || items.length === 0) continue;
                html += `
                    <div class="section">
                        <h3>${section} (${items.length}条)</h3>
                `;
                items.slice(0, 10).forEach(item => {
                    html += `
                        <div class="news-item">
                            <a href="${item.url}" target="_blank">${item.title || item.title_original}</a>
                            <span class="source">${item.source || ''}</span>
                        </div>
                    `;
                });
                if (items.length > 10) {
                    html += `<p style="color:#999;font-size:12px;padding:8px 0;">还有 ${items.length - 10} 条...</p>`;
                }
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // 生成报告
        async function generateReport() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = '生成中...';

            const reportType = document.getElementById('reportType').value;
            const checkboxes = document.querySelectorAll('.checkbox-group input:checked');
            const sections = Array.from(checkboxes).map(cb => cb.value);

            alert(`报告类型: ${reportType}\n选中板块: ${sections.join(', ')}\n\n报告将在后台生成，请稍后刷新页面查看。\n\n注意：需要配置 GitHub Token 才能触发生成。`);

            btn.disabled = false;
            btn.textContent = '生成报告';
        }

        // 页面加载时获取报告
        loadReport();
    </script>
</body>
</html>
